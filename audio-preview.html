<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#14110d" />
    <title>千軍令 — 音效預覽</title>
    <style>
      :root {
        --bg: #14110d;
        --panel: #1f1a14;
        --line: #3a3026;
        --ink: #efe4cf;
        --dim: #a8987c;
        --gold: #e0b252;
        --red: #c8453a;
        --btn: #2c241b;
        --btn-hi: #3b3024;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.5 'Noto Sans TC', system-ui, sans-serif;
      }
      #app { max-width: 1100px; margin: 0 auto; padding: 16px; }
      h1 { font-size: 22px; margin: 4px 0 2px; letter-spacing: 2px; color: var(--gold); }
      h2 { font-size: 15px; margin: 0 0 10px; color: var(--gold); letter-spacing: 1px; }
      .sub { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
      .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      button {
        background: var(--btn); color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
        padding: 8px 10px; font: inherit; cursor: pointer; text-align: left;
      }
      button:hover { background: var(--btn-hi); border-color: var(--gold); }
      button.on { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; color: var(--gold); }
      button.warn { border-color: var(--red); }
      button small { display: block; color: var(--dim); font-size: 11px; }
      .slider { display: grid; grid-template-columns: 92px 1fr 52px; gap: 8px; align-items: center; margin: 4px 0; }
      .slider input { width: 100%; accent-color: var(--gold); }
      .slider output { color: var(--dim); font-variant-numeric: tabular-nums; text-align: right; }
      .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
      #status { font: 12px/1.4 ui-monospace, Menlo, monospace; color: var(--dim); white-space: pre-wrap; margin: 0; }
      label.chk { display: inline-flex; gap: 6px; align-items: center; color: var(--dim); }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/dev/audioPreview.ts"></script>
  </body>
</html>
